name: Upgrade build check (temporary, no deploy)

on:
  push:
    branches:
      - upgrade/next-16

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Remove SQLite packages (not needed for D1 production)
        run: rm -rf node_modules/@payloadcms/db-sqlite node_modules/@libsql
      - name: Build with OpenNext (no deploy)
        run: npx opennextjs-cloudflare build
        env:
          NODE_OPTIONS: "--no-deprecation --max-old-space-size=8000"
          BUILD_PHASE: "true"
          NEXT_PUBLIC_PORTONE_STORE_ID: store-32c055e8-eaea-4e2a-bf26-cfdc4e73d548
          NEXT_PUBLIC_PORTONE_CHANNEL_KEY: channel-key-c4a0b6e0-4799-47bc-b21d-fbc420a1a308
